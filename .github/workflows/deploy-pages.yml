# Publishes the playable client to GitHub Pages.
#
# The prototype is a body fragment with no <head>, so it is wrapped into a real
# HTML document (viewport, title, theme) by tools/build-web.mjs before publishing.
#
# To connect the backend: repo Settings -> Secrets and variables -> Actions ->
# Variables -> New variable named ASHGATE_SERVER, value = your API base URL
# (e.g. https://ashgate-api.onrender.com). Without it the build stays offline-only.
name: Deploy client to Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/prototype/index.html'
      - 'tools/build-web.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build client
        env:
          ASHGATE_SERVER: ${{ vars.ASHGATE_SERVER }}
        run: node tools/build-web.mjs
      - name: Add .nojekyll
        run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
